[project]
name = "brsy"
version = "0.1.0"
description = "Independent SFedU grades companion: Telegram bot and Mini App"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "cryptography>=44", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brsy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
